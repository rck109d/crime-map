[project]
name = "crimemap"
version = "0.2.0"
description = "Archive and serve Atlanta Police Department crime incident data"
license = "MIT"
requires-python = ">=3.11"
# The loader deliberately uses only the standard library so the archive can be
# refreshed decades from now without resolving third-party packages.
dependencies = []

[project.scripts]
crimemap = "crimemap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crimemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
