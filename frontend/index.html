<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlanta Crime Map</title>
    <meta
      name="description"
      content="Explore Atlanta Police Department incident reports since 2021 on a map: filter by date, offense and area, see trends, and download the data."
    />
    <meta name="theme-color" content="#fcfcfb" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a19'/%3E%3Ccircle cx='11' cy='13' r='4' fill='%23eb6834'/%3E%3Ccircle cx='21' cy='11' r='3' fill='%232a78d6'/%3E%3Ccircle cx='18' cy='21' r='4' fill='%231baf7a'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint so the page does not flash the wrong one.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This map needs JavaScript. The underlying data is at https://github.com/rck109d/crime-map</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
